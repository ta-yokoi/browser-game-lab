<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf7ef" />
    <meta
      name="description"
      content="みつける、かぞえる、おぼえる。小さな子どもと親子で楽しむ、6つのやさしい知育あそび。"
    />
    <title>こもれび｜あそびのにわ</title>
    <link rel="stylesheet" href="./style.css?v=3" />
    <script type="module" src="./home.js?v=3"></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a href="./" class="brand"
          ><span class="brand-mark" aria-hidden="true">✳</span
          ><span>こもれび<small>あそびのにわ</small></span></a
        ><span class="header-note">おやこで、ゆっくり。</span>
      </header>
      <main>
        <section class="hero">
          <div class="hero-copy">
            <p class="eyebrow">ちいさな「できた！」を、ひとつずつ。</p>
            <h1>きょうは、<br />なにして <span>あそぼう？</span></h1>
            <p class="hero-note">
              みつけて、かぞえて、おぼえて。<br />きみのペースで
              あそべる、6つのにわ。
            </p>
            <a class="text-link" href="#games"
              >すきな あそびを えらんでね <span aria-hidden="true">↓</span></a
            >
          </div>
          <div class="hero-art" aria-hidden="true">
            <div class="sun"></div>
            <span class="spark spark-one">✧</span
            ><span class="spark spark-two">✧</span
            ><svg class="hero-bunny" viewBox="0 0 100 100">
              <use href="./assets/pictures.svg#bunny" /></svg
            ><svg class="hero-flower" viewBox="0 0 100 100">
              <use href="./assets/pictures.svg#flower" /></svg
            ><svg class="hero-apple" viewBox="0 0 100 100">
              <use href="./assets/pictures.svg#apple" />
            </svg>
            <div class="hill"></div>
            <span class="hello">いっしょに あそぼう</span>
          </div>
        </section>
        <section id="games" aria-labelledby="games-title">
          <div class="section-heading">
            <h2 id="games-title">あそびを えらぶ</h2>
            <span>ぜんぶで 6つ</span>
          </div>
          <div id="game-list" class="game-grid"></div>
          <noscript
            ><p>
              あそぶには、ブラウザのJavaScriptを有効にしてください。
            </p></noscript
          >
        </section>
        <aside class="parent-note">
          <span class="parent-flower" aria-hidden="true">✿</span>
          <div>
            <h2>おうちの方へ</h2>
            <p>
              はじめは、お子さまと一緒に。間違えても何度でも試せます。<br />時間制限や点数の競争はありません。各あそびの「おうちの方へ」から難易度を選べます。
            </p>
          </div>
        </aside>
      </main>
      <footer class="site-footer">
        <span>こもれび · あそびのにわ</span
        ><span>ひとつできたら、はなまる。</span>
      </footer>
    </div>
  </body>
</html>
